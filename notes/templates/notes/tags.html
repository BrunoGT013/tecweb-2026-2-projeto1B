{% extends "notes/base.html" %}

{% block content %}
<main class="container">
  <h2 class="page-title">Todas as tags</h2>

  <ul class="tag-list">
    {% for tag in tags %}
    <li><a class="tag-link" href="{% url 'tag_detail' tag.id %}">{{ tag.name }}</a></li>
    {% empty %}
    <li class="tag-empty">Nenhuma tag criada ainda.</li>
    {% endfor %}
  </ul>

  <div class="page-actions">
    <a class="btn btn-cancel" href="{% url 'index' %}">Voltar</a>
  </div>
</main>
{% endblock %}
